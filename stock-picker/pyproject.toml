[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-picker"
version = "0.0.0"
description = "Deterministic day-trading scanner — Block 0 scaffold and flat-files feasibility probe"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "pandas",
    "pyarrow",
    "psutil",
    "pydantic",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
